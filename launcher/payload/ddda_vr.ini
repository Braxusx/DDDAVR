[VR]
; ===== Dragon's Dogma: Dark Arisen VR - settings =====
; 1 = VR, 0 = normal flat-screen game
XR=1
; render size per eye (match your headset's recommended resolution)
VRModeWidth=3072
VRModeHeight=3264
; head tracking (F6 switches between head tracking and a virtual screen, F7 recentres)
HeadTracking=1
HeadPosition=1
; size of the world in VR (game units per metre)
WorldScale=100
; virtual screen used for menus / cutscenes (metres)
ScreenWidth=2.6
ScreenDistance=2.2
; HUD panel distance (metres)
UiDistance=3.0

; ===== visual options (1 = removed / on, 0 = game default) =====
; sun shafts (also toggled in game with F10)
KillGodRays=1
; lens flare ghosts and halo around the sun
HideLensFlare=1
; reduced glow / sun glare (uses ddda_vr_mods\bbsrpg_core_noglow*.arc, made by the launcher from your game files)
NoGlow=1
; low-health red overlay, cinematic overlay, sun-glare sheet, full-screen flashes
HideHurtOverlay=1
; cutscene subtitles raised by this many UI units (0 = game position; ~7 units = 1% of the view height)
SubtitleRaise=190
; how far away cutscene subtitles appear, in metres (they are drawn into both eye pictures)
SubtitleDepth=2.0
; NPC conversation box and its text size (1.0 = game size)
DialogueScale=1.3
; aiming reticle: 0 = game look, 1 = solid white, 2 = solid white with a dark edge for contrast
ReticleStyle=2
; quest markers, name tags and enemy health bars shown in the world over their NPC (0 = on the HUD panel; Home switches in game)
WorldMarkers=1
; their size (1.0 = as on the HUD panel) and how far they are lifted (UI units, 0 = where the game puts them)
WorldMarkerScale=1.0
WorldMarkerLift=0
; Draw distance: widens the area around you whose detailed scenery is loaded (trees, rocks, cliffs).
; 1 = the game's own (High / Farthest), 2 = 2x (performance impact), 3 = 3x (extreme performance impact).
DrawDistance=1

; ===== performance =====
; empty = Windows' own Direct3D 9 (default)
; d3d9_dxvk.dll = DXVK (Direct3D 9 on Vulkan): ~30% less CPU time, longer first loads while it builds its shader cache
D3D9Dll=
; with DXVK: "Building shader cache" notice in the headset while new shaders are compiled (0 = off, 2 = always shown, for a look)
ShaderCacheNotice=1

; ===== DLSS (NVIDIA RTX cards) =====
; 1 = on. Needs the ddda_vr_dlss folder (ddda_vr_dlss64.exe + nvngx_dlss.dll) next to d3d9.dll. The Insert key switches it on/off in game
Dlss=1
; 0 = DLAA (full resolution, best image) | 1 = Ultra Quality | 2 = Quality | 3 = Balanced | 4 = Performance
; (1-4 render the game smaller and upscale it to VRModeWidth x VRModeHeight)
DlssQuality=0
; DLSS model: 11 = preset K (default), 10 = J, 12 = L, 13 = M, 16 = NVIDIA's choice
DlssPreset=11

; ===== window (normally leave as is) =====
NoVsync=1
ForceWindowed=0
ForceWidth=0
ForceHeight=0
ClientRectVR=1

; ===== developer (leave at 0) =====
; F3/F4/F5/F8/F9/F11 test keys and the frame capture
DevKeys=0
; GPU timestamp queries in the log
PerfStats=0
; capture extra: pixel shader constants of the last draws (F8)
DumpPostPasses=0
; per-hook timing line (costs ~1 ms per frame)
ProfileHooks=0
